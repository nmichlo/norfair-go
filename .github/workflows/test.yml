name: test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  go-test:
    runs-on: ubuntu-latest
    container: ghcr.io/hybridgroup/opencv:4.12.0
    strategy:
      matrix:
        go-version: ['1.24.x']

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: go mod download
        run: go mod download

      - name: go test
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...


      - name: codecov
        uses: codecov/codecov-action@v4
        if: matrix.go-version == '1.24.x'
        with:
          file: ./coverage.out
          flags: unittests
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # The branch-protection gate. A required status check is matched by name, and
  # `go-test` is a matrix job, so its check is "go-test (1.24.x)" -- it changes
  # the moment the Go version list does, and a required check that stops
  # reporting blocks every PR forever. This job is plain, so its check is
  # always exactly "test".
  test:
    needs: [go-test]
    # always(), or the gate is skipped when what it guards fails -- and a
    # skipped required check counts as success.
    if: always()
    runs-on: ubuntu-latest
    steps:
      # `skipped` counts as failure too: a job that did not run has not passed,
      # and a gate that lets it through is worse than no gate. Actions prints
      # `env:` into the run group, so the log shows which it was.
      - name: Check results
        env:
          FAILED: >-
            ${{ contains(needs.*.result, 'failure')
             || contains(needs.*.result, 'cancelled')
             || contains(needs.*.result, 'skipped') }}
        run: '[ "${FAILED}" = "false" ]'
