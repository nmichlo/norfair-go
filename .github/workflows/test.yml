name: test

on:
  push:
    branches:
      - main
  pull_request:

# least privilege: jobs that need more declare it themselves, and a job-level
# `permissions:` replaces this one rather than adding to it.
permissions:
  contents: read

jobs:
  go-test:
    runs-on: ubuntu-latest
    container: ghcr.io/hybridgroup/opencv:4.12.0
    strategy:
      matrix:
        go-version: ['1.24.x']

    steps:
      # persist-credentials: false -- checkout otherwise leaves the job's token
      # in .git/config, where any later step can read it. nothing here pushes.
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: go mod download
        run: go mod download

      - name: go test
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...


      - name: codecov
        uses: codecov/codecov-action@v4
        if: matrix.go-version == '1.24.x'
        with:
          file: ./coverage.out
          flags: unittests
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # The branch-protection gate; see nmichlo/.github/actions/gate for why it
  # exists. `always()` is required, or the gate is skipped when what it guards
  # fails -- and a skipped required check counts as success.
  test:
    needs: [go-test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: nmichlo/.github/actions/gate@main
        with:
          needs: ${{ toJSON(needs) }}
